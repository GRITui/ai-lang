[workspace]
resolver = "2"
members = [
    "crates/ainl-core",
    "crates/ainl-transpile",
    "crates/ainl-cli",
    "crates/ainl-cc",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
