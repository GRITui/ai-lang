name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: build · test · fmt · clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Keys on the Rust/C sources as well as Cargo.toml, because this
          # cache restores `target/` — which holds *binaries*. A Cargo.toml-only
          # key let a .rs-only change restore a stale `ainl`, and a test that
          # shells out to that binary then silently compared against a build
          # from before the change. Broader than strictly necessary (rustc does
          # its own invalidation) but never stale.
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('crates/**/*.rs', 'crates/**/*.c') }}

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --verbose

      - name: Test
        run: cargo test --workspace --verbose

  transpile-equivalence:
    name: transpilers byte-equal (python · node · ruby)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Keys on the Rust/C sources as well as Cargo.toml, because this
          # cache restores `target/` — which holds *binaries*. A Cargo.toml-only
          # key let a .rs-only change restore a stale `ainl`, and a test that
          # shells out to that binary then silently compared against a build
          # from before the change. Broader than strictly necessary (rustc does
          # its own invalidation) but never stale.
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('crates/**/*.rs', 'crates/**/*.c') }}

      # python3, node, and ruby are preinstalled on ubuntu-latest runners.
      - name: Build release binary
        run: cargo build --release

      - name: Verify transpiled output matches the interpreter
        run: ./scripts/check-transpile.sh

  modules:
    name: modules (import resolves; AOT inlines; transpilers refuse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('crates/**/*.rs', 'crates/**/*.c') }}

      - name: Build release binary
        run: cargo build --release

      # Two halves that assert OPPOSITE things, because the difference is the
      # design. The multi-file example must compile to a standalone AOT binary
      # that still works after its sources are deleted (the backend resolves and
      # inlines the graph), while the three transpilers must REFUSE it —
      # `import` is a keyword in Python, Ruby and JavaScript, so an unhandled
      # directive would lower into the host's own import machinery and produce a
      # program that builds cleanly and does the wrong thing.
      - name: Module resolution + AOT inlining + transpiler refusal gate
        run: ./scripts/check-modules.sh

      # Every behavioral claim in SYNTAX.md §3b, executed against the real
      # binary. Doc claims written from memory are the ones that rot: the
      # resolution order, the "does not re-export" rule and the collision text
      # were all plausible and all wrong on first draft. This turns the section
      # from prose into a test.
      - name: Documented import behavior matches the interpreter
        run: ./scripts/check-docs-import.sh

  packages:
    name: "packages (ainl pkg: resolve, vendor, verify, standalone AOT)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('crates/**/*.rs', 'crates/**/*.c') }}

      - name: Build release binary
        run: cargo build --release

      # The package gate, and the reason it needs `cc`: the load-bearing
      # assertion is that a program importing a *vendored* package compiles to a
      # binary that still runs after every .ainl file is deleted. That is the
      # whole argument for vendoring — a package manager whose AOT output read
      # its dependencies off disk would be worse than no package manager.
      # `cc` is preinstalled on ubuntu runners.
      - name: Package manager + standalone AOT gate
        run: ./scripts/check-pkg.sh

  if-parity:
    name: if (a 2-arg `if` in a closure body; 5-backend parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: if-parity-${{ hashFiles('Cargo.lock') }}
          restore-keys: if-parity-

      - name: Install Python, Node and Ruby
        # These three are the reason the job exists. A 2-arg `if` compiled to
        # a trailing Nil with no Jump over it, so a TRUE condition pushed both
        # the then-value and the Nil; in a fn/let body the surplus shifted the
        # next form's operand. A `while` masked it, so the bug survived the
        # language's whole life. "It ran" is not the claim; "the bytes matched
        # the interpreter" is — and a leaked operand is invisible in a single
        # call, so every program here makes a SECOND call after the `if`.
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 nodejs ruby

      - run: cargo build --release

      # Eight programs through five runners — interpreter/VM, AOT C, python3,
      # node, ruby — diffed byte for byte. The AOT and transpiler backends
      # were always right (a host `if`/`else` assigns one temporary; there is
      # no operand stack to over-push), and this is what turns that from an
      # assumption into a gate. The AOT half needs `cc`, preinstalled on
      # ubuntu runners.
      - name: Documented if behavior + 5-backend parity
        run: ./scripts/check-if-parity.sh

  and-or-parity:
    name: and/or (return an operand, not a boolean; 5-backend parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: and-or-parity-${{ hashFiles('Cargo.lock') }}
          restore-keys: and-or-parity-

      - name: Install Python, Node and Ruby
        # `and`/`or` return an OPERAND, not a boolean, and nothing pinned that
        # until this job. The AOT emitter seeded its accumulator with
        # `v_bool(1)` and overwrote it only on the short-circuit path, so an
        # all-truthy chain returned the seed: `(and 1 2 3)` printed `true` under
        # AOT C while all four other backends printed `3`. The collections gate
        # could not see it because every `and`/`or` there was a bare boolean
        # guard, where "returns a boolean" and "returns the operand" are
        # indistinguishable — so every program below uses NON-boolean operands
        # and prints the result, making the return value the thing under test.
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 nodejs ruby

      - run: cargo build --release

      - name: and/or returns operands + 5-backend parity
        run: ./scripts/check-and-or-parity.sh

  try-catch:
    name: try/catch (4-backend parity on the error path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: try-catch-${{ hashFiles('Cargo.lock') }}
          restore-keys: try-catch-

      - name: Install Python, Node and Ruby
        # The parity half of the gate needs all three hosts. A `catch` binds a
        # MESSAGE a program may compare, so "it ran" is not the claim — "the
        # bytes matched the interpreter" is, and that cannot be checked with one
        # host present.
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 nodejs ruby

      - run: cargo build --release

      # Every claim in SYNTAX.md §3e, executed against the real binary, plus
      # the byte-identical check across the interpreter, the AOT C binary and
      # the three transpiler hosts. The `e` shape and the "no OS error text"
      # rule are the load-bearing ones: both were plausible on first draft and
      # both were wrong — the caught value was a host exception on two of the
      # three transpilers, and the message embedded `strerror` output that
      # differs per platform.
      - name: Documented try/catch behavior + 4-backend parity
        run: ./scripts/check-docs-try.sh

  collections:
    name: collections (map/filter/reduce/sort; fn as data on 4 backends)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: collections-${{ hashFiles('Cargo.lock') }}
          restore-keys: collections-

      - name: Install Python, Node and Ruby
        # These three are the reason the job exists. `filter`'s predicate is
        # decided by truthiness, and `0` and `""` are TRUTHY in AINL while all
        # three hosts call them falsey — so a `filter` compiled with host
        # truthiness silently drops elements on one target and nowhere else.
        # "It ran" is not the claim; "the bytes matched the interpreter" is.
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 nodejs ruby

      - run: cargo build --release

      # Every claim in SYNTAX.md §3f, executed against the real binary, plus
      # the byte-identical check across the interpreter, the AOT C binary and
      # the three transpiler hosts — including a comparator `sort`, a `reduce`
      # that builds a list, stability, and the whole truthiness table.
      - name: Documented collections behavior + 4-backend parity
        run: ./scripts/check-docs-collections.sh

  byte-strings:
    name: byte strings (substring/char/code/…; byte offsets on 4 backends)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: byte-strings-${{ hashFiles('Cargo.lock') }}
          restore-keys: byte-strings-

      - name: Install Python, Node and Ruby
        # These three are the reason the job exists. The six primitives are the
        # first where a host's *natural* implementation is wrong: Python's
        # `str.find` and Ruby's `String#index` return a character offset and
        # JavaScript's `indexOf` a UTF-16 code-unit offset, so three different
        # wrong numbers are what a naive port produces. "It ran" is not the
        # claim; "the bytes matched the interpreter" is.
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 nodejs ruby

      - run: cargo build --release

      # One program through five runners — interpreter, AOT C, python3, node,
      # ruby — diffed byte for byte on stdout AND stderr, including the shared
      # error messages and a multi-byte UTF-8 string that makes the byte
      # semantics observable. The AOT half needs `cc`, which is preinstalled on
      # ubuntu runners.
      - name: Documented byte-string behavior + 4-backend parity
        run: ./scripts/check-byte-strings.sh

  file-system:
    name: file system (mkdir/rename/copy/is-dir/file-size; 4-backend parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: file-system-${{ hashFiles('Cargo.lock') }}
          restore-keys: file-system-

      - name: Install Python, Node and Ruby
        # These three are the reason the job exists. All five builtins are the
        # first where a host's *natural* implementation is actively dangerous:
        # os.rename, fs.renameSync and File.rename all OVERWRITE an existing
        # destination where POSIX rename(2) refuses, so a naive port silently
        # destroys a file on three backends and preserves it on the fourth. "It
        # ran" is not the claim; "the bytes matched the interpreter, and the
        # destination survived" is.
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 nodejs ruby

      - run: cargo build --release

      # One program through five runners — interpreter, AOT C, python3, node,
      # ruby — diffed byte for byte on stdout AND stderr and on return code.
      # Every runner gets a private scratch tree, because the program creates,
      # moves and deletes files and is not idempotent; sharing one would make
      # the diff noise. The AOT half needs `cc`, which is preinstalled on
      # ubuntu runners.
      - name: Documented file-system behavior + 4-backend parity
        run: ./scripts/check-fs-builtins.sh

      # The documentation half: every snippet in SYNTAX.md §3h is run and
      # compared to the answer written beside it, so §3h cannot drift from the
      # language. This section is almost entirely about behavior that is *not*
      # what a host library does by default, which is exactly the kind of claim
      # that rots silently.
      - name: Documented file-system semantics
        run: ./scripts/check-docs-fs.sh

      # The same for SYNTAX.md §3k (storage). §3k's claims are the ones a host
      # file API cannot reproduce — an append-only log, last-write-wins, a
      # missing key as nil, a refused open that creates no file, a torn tail
      # truncated on disk — so they rot the same way and are checked the same
      # way. It also asserts the backend asymmetry: the transpilers must refuse
      # `db-*`, and `ainl compile` must accept it.
      - name: Documented storage semantics
        run: ./scripts/check-docs-db.sh

      # And for §3l (the key-value layer). Its claims are the ones a JSON codec
      # cannot be assumed to have: a tombstone delete that has to clear db-get,
      # db-keys AND db-count at once, keys sorted in byte order, an int that must
      # not come back as 1.0, and `db-put` text that is an error rather than a
      # nil when it is read back through the value layer. The last of those is
      # the one a filtered comparison would hide, so it is asserted exactly.
      - name: Documented key-value semantics
        run: ./scripts/check-docs-kv.sh

  kv-aot:
    name: "key-value (3-backend parity + cross-process persistence)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-kv-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('crates/**/*.rs', 'crates/**/*.c') }}

      - run: cargo build --release

      # `cargo test` compiles a *debug* test binary, and `db_kv_aot.rs` finds the
      # `ainl` CLI by walking up from its own executable — so it needs
      # `target/debug/ainl`, not the release one this job just built. Without
      # this the whole file fails at its first `ainl()` call with "the ainl CLI
      # was not found", which reads like a parity failure and is not one.
      - run: cargo build

      # The same program, the interpreter and a *compiled* binary, diffed byte
      # for byte on stdout AND stderr. This job exists because the value layer
      # in `runtime.c` is a hand-port, not a binding — there is no FFI in this
      # project — so "the engine is shared, so it works everywhere for free" is
      # true for the two evaluators and false here, and the only way to know is
      # to compile and compare.
      #
      # The same job also runs three *separate* compiled processes, because
      # "the value survived" is a claim about a file and a same-process reopen
      # cannot make it: an index that never reached the disk passes every
      # in-process test.
      - name: "Key-value parity: interpreter vs compiled AOT"
        run: cargo test -p ainl-cc --test db_kv_aot -- --nocapture

      # The refusal matrix, asserted in both directions: all ten `db-*` names
      # refused by python/js/ruby with the symbol named, and accepted by AOT.
      # The second half is the one a blanket rule would break while every
      # refusal test kept passing. This one wants the *release* binary, so it
      # runs after the release build above.
      - name: "db-* refusal matrix (transpilers refuse, AOT accepts)"
        run: ./scripts/check-refusal-kv.sh

  http:
    name: http (client works locally; TLS + backends refuse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Keys on the Rust/C sources as well as Cargo.toml, because this
          # cache restores `target/` — which holds *binaries*. A Cargo.toml-only
          # key let a .rs-only change restore a stale `ainl`, and a test that
          # shells out to that binary then silently compared against a build
          # from before the change. Broader than strictly necessary (rustc does
          # its own invalidation) but never stale.
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('crates/**/*.rs', 'crates/**/*.c') }}

      - name: Build release binary
        run: cargo build --release

      # python3 is preinstalled on ubuntu-latest runners. The server is stdlib
      # only and binds to loopback on a port the OS picks, so this job needs no
      # outbound network and no fixture host — the same "no external network"
      # rule the Rust suite in crates/ainl-core/tests/http.rs follows.
      - name: Documented HTTP behavior matches the interpreter
        run: ./scripts/check-docs-http.sh

  aot:
    name: AOT (C -> cc) byte-identical + step cap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Keys on the Rust/C sources as well as Cargo.toml, because this
          # cache restores `target/` — which holds *binaries*. A Cargo.toml-only
          # key let a .rs-only change restore a stale `ainl`, and a test that
          # shells out to that binary then silently compared against a build
          # from before the change. Broader than strictly necessary (rustc does
          # its own invalidation) but never stale.
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('crates/**/*.rs', 'crates/**/*.c') }}

      # cc is preinstalled on ubuntu runners.
      - name: Verify cc is present
        run: cc --version

      - name: Build release binary
        run: cargo build --release

      # Compiles every example + the 40k benchmark with `ainl compile` (which
      # shells out to cc) and diffs the compiled binary's stdout against
      # `ainl run`. Also checks the step cap and its AINL_MAX_STEPS override.
      - name: AOT parity + step-counter gate
        run: ./scripts/check-aot.sh

  testing:
    name: ainl test (test runner works; exit code is the contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('crates/**/*.rs', 'crates/**/*.c') }}

      - name: Build release binary
        run: cargo build --release

      # The card's acceptance test, end to end against the real binary: the
      # library and parity suites prove the `test` builtin behaves, and this
      # proves the *runner* does — discover a directory, report a summary, exit
      # non-zero on failure. A runner that printed a nice summary and always
      # exited 0 would pass every other suite in this repo, and this is the job
      # that would catch it.
      - name: ainl test runner end to end
        run: ./scripts/check-ainl-test.sh

  aot-standalone:
    name: AOT binary runs on clean Linux (musl, static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Keys on the Rust/C sources as well as Cargo.toml, because this
          # cache restores `target/` — which holds *binaries*. A Cargo.toml-only
          # key let a .rs-only change restore a stale `ainl`, and a test that
          # shells out to that binary then silently compared against a build
          # from before the change. Broader than strictly necessary (rustc does
          # its own invalidation) but never stale.
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('crates/**/*.rs', 'crates/**/*.c') }}

      - name: Build release binary
        run: cargo build --release

      # Provides /usr/bin/x86_64-linux-musl-gcc.
      - name: Install musl-gcc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      # Standalone proof: the *compiled AINL program* — not the ainl binary —
      # must link with nothing but libc. Emitting the .c with --keep-c and
      # linking it with musl-gcc proves the output carries its own runtime (the
      # micro-runtime is inlined into the single .c) and needs no host AINL.
      - name: Emit standalone C, link static with musl-gcc
        run: |
          ./target/release/ainl compile examples/hello.ainl -o hello.c --c-only
          # -lm: fmod() (float formatting) lives in libm, not libc.
          x86_64-linux-musl-gcc -O2 -static -o hello.musl hello.c -lm
          file hello.musl
          file hello.musl | grep -q "statically linked"
          # `ldd` on a fully static binary prints "not a dynamic executable" and
          # exits 1, so it must be guarded with `|| true` — under `set -e` the
          # bare command aborts the step before the check can run (which is what
          # the first version of this step did).
          echo "== ldd =="
          ldd_out=$(ldd hello.musl 2>&1 || true)
          echo "$ldd_out"
          echo "$ldd_out" | grep -Eq "not a dynamic executable|statically linked"
          echo "ok   statically linked: no dynamic dependencies"

      - name: Run it (uploads the standalone binary as an artifact)
        run: |
          ./hello.musl
          ls -lh hello.musl

      - uses: actions/upload-artifact@v4
        with:
          name: ainl-aot-standalone-musl
          path: hello.musl

  packaging:
    name: packaging (install.sh + SHA256SUMS + doctor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('crates/**/*.rs', 'crates/**/*.c') }}

      - name: Build release binary
        run: cargo build --release

      # The installer's security properties (verify-before-unpack, refuse an
      # unverified release, atomic rename, idempotent upgrade) are regression
      # risks, not one-time work — they are asserted here against a local fake
      # release over file://, so no network or published tag is involved.
      - name: install.sh end-to-end (verified install + refusal paths)
        run: ./scripts/check-install.sh

      - name: SHA256SUMS step (as the release job runs it)
        run: ./scripts/check-sums.sh

      - name: install.sh is POSIX sh (dash parses it)
        run: |
          # The installer is run as `… | sh`, where sh is dash on Debian/Ubuntu
          # and busybox ash on Alpine. A bashism that only shows up there would
          # break every real install while passing macOS.
          if command -v dash >/dev/null 2>&1; then
            dash -n scripts/install.sh && echo "dash: ok"
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq dash
            dash -n scripts/install.sh && echo "dash: ok"
          fi

      # install.sh cannot source lib-target.sh (it is piped to `sh` and must be
      # self-contained), so the platform→target mapping exists twice. This job
      # runs on Linux while the tests are also run on macOS by developers, and
      # it is what caught the fixtures serving a macOS-named asset on an
      # ubuntu runner.
      - name: platform mapping in sync (install.sh vs lib-target.sh)
        run: ./scripts/check-target-sync.sh

      - name: doctor without a C compiler must SKIP, not FAIL
        run: ./scripts/check-doctor-no-cc.sh

      # The card's acceptance test: a full install under `env -i` with a fresh
      # HOME and a minimal PATH, then --version / doctor / eval from the
      # installed binary. It asserts the install works with no root, no
      # inherited environment, and no C compiler.
      - name: clean-env install (env -i, fresh HOME, no cc)
        run: ./scripts/check-install-clean-env.sh

      # Re-runs the whole packaging suite under a faked Linux `uname`. The
      # first CI run of this work passed on macOS and failed on ubuntu because
      # the fixtures hardcoded the macOS asset name; this makes the
      # host-dependent branch testable from any machine, not only from the one
      # whose CI runner happens to match.
      - name: platform matrix (packaging suite as macOS and as Linux)
        run: ./scripts/check-platform-matrix.sh

      # The --version parser the clean-env test relies on, pinned against every
      # shape the binary can print — including a degraded "unknown" target,
      # which must be rejected rather than read as a triple.
      - name: --version field parsing
        run: ./scripts/check-version-field.sh

      # The release job publishes RELEASE_NOTES.md verbatim to the release
      # page, so a link in it that 404s ships to users. Cheap to check, and it
      # already caught one bad reference written here.
      - name: relative markdown links resolve
        run: ./scripts/check-links.sh

      # The landing page (site/index.html) restates the README's headline
      # numbers for people who never open the repo. If the README is corrected
      # and the page is not, the pitch quietly starts overclaiming — which is
      # the one failure mode this project cannot afford. Assert the numbers
      # agree, and that the page stays self-contained (no local assets) so it
      # keeps deploying to GitHub Pages as a single file.
      - name: landing page in sync with the README (no number drift)
        run: ./scripts/check-site.py

  examples:
    name: examples corpus (every example runs; few-shot is current)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('crates/**/*.rs', 'crates/**/*.c') }}

      - name: Build release binary
        run: cargo build --release

      # python3, node and ruby are preinstalled on ubuntu-latest runners, and
      # the HTTP example's fixture is a stdlib Python one on loopback — so this
      # job needs no outbound network and no API key.
      #
      # The card's acceptance test, end to end. A corpus of examples is a
      # PROPOSITION to a model, and a model shown a program that does not run
      # learns the broken shape — so every example is executed here, every
      # portable one is diffed byte-for-byte against all three transpiler
      # targets, and the generated few-shot file is checked against the
      # examples it was generated from. The last check is the important one:
      # few-shot.txt is what a model actually reads, and a stale copy teaches
      # syntax that no longer parses.
      - name: Every example runs, on every backend it claims
        run: ./scripts/check-examples.sh

  gbnf-conformance:
    name: GBNF conformance (well-formed + fuzz grammar ⊆ parser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Keys on the Rust/C sources as well as Cargo.toml, because this
          # cache restores `target/` — which holds *binaries*. A Cargo.toml-only
          # key let a .rs-only change restore a stale `ainl`, and a test that
          # shells out to that binary then silently compared against a build
          # from before the change. Broader than strictly necessary (rustc does
          # its own invalidation) but never stale.
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('crates/**/*.rs', 'crates/**/*.c') }}

      - name: Build release binary
        run: cargo build --release

      # python3 is preinstalled on ubuntu-latest runners.
      - name: Install GBNF parser (llguidance)
        run: python3 -m pip install --quiet llguidance

      - name: Run conformance check (well-formed + ≥1000 fuzzed strings parse)
        run: python3 scripts/gbnf-conformance.py --count 1000

  gen:
    name: ainl gen (repair loop fires; GBNF matchers agree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Keys on the Rust/C sources as well as Cargo.toml, because this
          # cache restores `target/` — which holds *binaries*. A Cargo.toml-only
          # key let a .rs-only change restore a stale `ainl`, and a test that
          # shells out to that binary then silently compared against a build
          # from before the change. Broader than strictly necessary (rustc does
          # its own invalidation) but never stale.
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('crates/**/*.rs', 'crates/**/*.c') }}

      - name: Build release binary
        run: cargo build --release

      # The two GBNF membership implementations — the Rust one the command
      # ships and the Python one the generation harness has always used — must
      # agree on every committed generation, every hand-picked edge, and 800
      # fuzz inputs. They already did not: the first run of this check
      # reported 9 mismatches that were a framing bug in the checker itself
      # (the "\n\0\n" separator terminated a trailing comment, so the two
      # sides were being fed different bytes). A disagreement here is a real
      # finding, not a flake, so it is a gate.
      - name: Rust and Python GBNF matchers agree
        run: python3 scripts/check-gbnf-rust.py --count 400

      # The repair loop cannot be reached by a passing test against the real
      # model, because the model is too reliable to fail on demand. This stands
      # up a local stub that returns a program which dies at run time, and
      # asserts the command feeds back model-readable text and succeeds on the
      # retry. It also pins the two honesty guarantees: --no-probe must not
      # claim the constraint was verified, and --grammar-field none must not
      # claim a grammar was sent. No network, no API key.
      - name: Repair loop fires, and the constraint report is honest
        run: python3 scripts/check-gen-repair.py
