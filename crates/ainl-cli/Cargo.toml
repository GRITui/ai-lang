[package]
name = "ainl-cli"
description = "The `ainl` command-line runtime for the AI-Native Language."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ainl"
path = "src/main.rs"

[dependencies]
ainl-core = { path = "../ainl-core" }
ainl-transpile = { path = "../ainl-transpile" }
ainl-cc = { path = "../ainl-cc" }

# Test-only: the `read-pass` pty test (tests/read_pass_pty.rs) drives a real
# pty with `forkpty`. A dev-dependency is NOT linked into the release `ainl`
# binary, so it does not affect the `otool -L` zero-dep gate. (The `read-pass`
# builtin itself uses inline termios FFI in ainl-core, not this crate.)
[dev-dependencies]
libc = "0.2"
